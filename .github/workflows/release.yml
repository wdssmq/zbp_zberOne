name: Build & Release ZBA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: zlib, simplexml, json

      - name: Extract Plugin ID
        id: plugin
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"

          if [[ "$REPO_NAME" != zbp_* ]]; then
            echo "::error::仓库名必须为 zbp_<PluginID> 格式，当前为: $REPO_NAME"
            exit 1
          fi

          PLUGIN_ID="${REPO_NAME#zbp_}"

          if [[ -z "$PLUGIN_ID" ]]; then
            echo "::error::未提取到 Plugin ID"
            exit 1
          fi

          echo "plugin_id=$PLUGIN_ID" >> "$GITHUB_OUTPUT"

      - name: Pack ZBA Application
        id: pack
        uses: wdssmq/zbp-app-pack@v1
        with:
          path: "./${{ steps.plugin.outputs.plugin_id }}"
          gzip: "true"
          verbose: "false"

      - name: Upload to filepost.dev
        id: upload
        env:
          FILE_POST_API: ${{ secrets.FILE_POST_API }}
          ZBA_NAME: ${{ steps.pack.outputs.zba-name }}
        run: |
          curl --fail-with-body -X POST https://upload.filepost.dev/v1/upload \
            -H "X-API-Key: $FILE_POST_API" \
            -F "file=@${ZBA_NAME}" \
            -F "filename_mode=public" \
            -o response.json

            # 查看完整响应（调试用）
            # cat response.json | jq .

            # 提取单个字段
            FILE_URL=$(jq -r '.url' response.json)
            echo "文件地址: $FILE_URL"

            # 写回 GitHub 输出，供后续步骤使用
            echo "file_url=$FILE_URL" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.pack.outputs.zba-path }}
          name: "${{ steps.pack.outputs.app-name }} v${{ steps.pack.outputs.app-version }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📦 应用信息
            - **应用 ID**：`${{ steps.pack.outputs.app-id }}`
            - **应用类型**：`${{ steps.pack.outputs.app-type }}`
            - **版本号**：`${{ steps.pack.outputs.app-version }}`
            - **最后修改**：`${{ steps.pack.outputs.app-modified }}`
            - **安装包**：`${{ steps.pack.outputs.zba-name }}`
            ${{ steps.upload.outputs.file_url && format('- **备用下载**：[{0}]({1} "{2}")', steps.pack.outputs.zba-name || '下载链接', steps.upload.outputs.file_url, steps.pack.outputs.zba-name || '下载链接') }}
